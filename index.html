<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-visual: the soft keyboard resizes the visual
       viewport only, leaving window.innerHeight (and so the sheet) still while
       a note is being written. See DECISIONS B28. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no, interactive-widget=resizes-visual">
  <meta name="theme-color" content="#EEEBEF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A161C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>To-Do Boards</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Board view: the single scaled page. Zero chrome (UIUX §1). -->
  <div id="board-view">
    <!-- Desktop-only board rail (issues #9/#10): a sunken, always-visible pane.
         Sits outside #board, so the gesture recognizer never sees its events.
         display:none unless html.desktop; hidden from AT off-desktop too. -->
    <aside id="pane" aria-label="Boards">
      <button id="pane-new" class="primary-btn" type="button">New board</button>
      <div id="pane-cards" role="list"></div>
      <div id="pane-more" aria-hidden="true" hidden></div>
    </aside>

    <!-- The one logical 900x1000 page. transform:scale() applied in JS. -->
    <div id="board" role="application" aria-label="Board" aria-roledescription="spatial board">

      <!-- The four permanent anchors (PRD §6.1). contenteditable is toggled on
           in JS only while editing, so the gesture recognizer owns tap/drag/
           long-press without fighting native focus.

           The top band is drawn furniture, independent of content (issue #38):
           one rule across the sheet, a permanent header per side zone, and the
           title card overhanging the rule and occluding it. Same three-part
           split the Parking Lot already uses (rule / header / items). -->
      <div id="band-rule" aria-hidden="true"></div>

      <div class="band-zone" id="zone-components">
        <div class="anchor" id="anchor-components" data-anchor="components" tabindex="0"
             role="textbox" aria-multiline="true" aria-label="Components"></div>
        <div class="band-label" aria-hidden="true">Components</div>
      </div>

      <div class="band-zone" id="zone-requirements">
        <div class="anchor" id="anchor-requirements" data-anchor="requirements" tabindex="0"
             role="textbox" aria-multiline="true" aria-label="Requirements"></div>
        <div class="band-label" aria-hidden="true">Requirements</div>
      </div>

      <div class="anchor" id="anchor-title" data-anchor="title"
           data-placeholder="What&rsquo;s up?" tabindex="0"
           role="textbox" aria-multiline="true" aria-label="Title"></div>

      <!-- Parking Lot zone (PRD §6.5). Unframed stacked lines. -->
      <div id="lot" data-anchor="lot">
        <div id="lot-rule" aria-hidden="true"></div>
        <div id="lot-header" aria-hidden="true">Parking Lot</div>
        <div id="lot-items"></div>
      </div>

      <!-- Free-canvas notes are injected here by app.js, absolutely positioned. -->
    </div>
  </div>

  <!-- Board list view (PRD §6.7 / UIUX §10): the only other screen. -->
  <section id="list-view" hidden aria-label="Boards">
    <header id="list-header">
      <h1 id="list-title">Boards</h1>
      <button id="new-board" class="primary-btn" type="button">New board</button>
    </header>
    <div id="list-rows" role="list"></div>
  </section>

  <!-- Transient surfaces (elevation = "temporary, above the page", UIUX §2.4). -->
  <div id="menu" role="menu" aria-label="Actions" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
